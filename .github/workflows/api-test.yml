name: API CI

on:
  push:
    paths:
      - "services/showingflow-api/**"
      - ".github/workflows/api-test.yml"
  pull_request:
    paths:
      - "services/showingflow-api/**"
      - ".github/workflows/api-test.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 409415529879.dkr.ecr.us-east-2.amazonaws.com
  ECR_REPOSITORY: showingflow-api

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
        working-directory: services/showingflow-api

      - name: Run API tests
        run: ./gradlew test
        working-directory: services/showingflow-api

      - name: Build API Docker image
        run: docker build -t showingflow-api -f services/showingflow-api/Dockerfile services/showingflow-api

      - name: Compute image tag
        id: image
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::409415529879:role/github-actions-showingflow-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag image for ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag showingflow-api:latest $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.image.outputs.tag }}
          docker tag showingflow-api:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Push image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.image.outputs.tag }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
