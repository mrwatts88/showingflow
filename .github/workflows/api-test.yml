name: API CI

on:
  push:
    paths:
      - "services/showingflow-api/**"
      - ".github/workflows/api-test.yml"
  pull_request:
    paths:
      - "services/showingflow-api/**"
      - ".github/workflows/api-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
        working-directory: services/showingflow-api

      - name: Run API tests
        run: ./gradlew test
        working-directory: services/showingflow-api

      - name: Build API Docker image
        run: docker build -t showingflow-api -f services/showingflow-api/Dockerfile services/showingflow-api
